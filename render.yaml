services:
  - type: web
    name: jsr-lending-backend
    runtime: node
    buildCommand: npm install --legacy-peer-deps && npm run build && npm install --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://localhost,capacitor://localhost,https://loan-api-bz0y.onrender.com
