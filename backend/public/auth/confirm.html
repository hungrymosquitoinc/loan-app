<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSR Lending - Email Confirmed</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: #0a1628; color: #e0e7ef;
  }
  .card {
    background: #111d32; border: 1px solid #1c3050; border-radius: 16px;
    padding: 40px 32px; max-width: 380px; width: 90%; text-align: center;
  }
  .logo { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 20px; }
  h1 { font-size: 20px; margin-bottom: 8px; color: #fff; }
  p { font-size: 14px; color: #8899aa; line-height: 1.6; margin-bottom: 20px; }
  .btn {
    display: inline-block; padding: 14px 32px; background: #2563eb;
    color: #fff; border: none; border-radius: 8px; font-size: 16px;
    font-weight: 600; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: #1d4ed8; }
  .check { font-size: 56px; margin-bottom: 16px; color: #22c55e; }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="/logo.png" alt="JSR Lending">
  <div class="check">&#10003;</div>
  <h1>Email Confirmed</h1>
  <p>Your account is ready. Tap the button below to open the app.</p>
  <a id="open-btn" class="btn" href="#">Open JSR Lending</a>
</div>
<script src="/auth/confirm.js"></script>
</body>
</html>
